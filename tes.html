<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tes Koneksi Undangan</title>
<style>
  body{font:15px/1.5 system-ui,sans-serif;margin:0;padding:16px;background:#fff;color:#222}
  h1{font-size:20px;margin:0 0 6px}
  p{margin:6px 0 12px;color:#555}
  button{font:600 16px system-ui;padding:12px 20px;border:0;border-radius:8px;background:#222;color:#fff}
  button:disabled{opacity:.5}
  .r{border-left:5px solid #999;padding:8px 10px;margin:10px 0;background:#f6f6f6;word-break:break-word}
  .r.ok{border-color:#1a8a3c}.r.bad{border-color:#c62828;background:#fdecec}.r.info{border-color:#1565c0}
  .r b{display:block}
  .r span{font:13px/1.4 ui-monospace,monospace;color:#333}
</style>
</head>
<body>
<h1>Tes Koneksi Undangan</h1>
<p>Tekan tombol, tunggu sampai muncul tulisan <b>SELESAI</b>, lalu screenshot seluruh halaman ini (gulir ke bawah kalau panjang).</p>
<button id="go">Jalankan tes</button>
<div id="out"></div>

<script>
const SB_URL = "https://cuqozpuulngkgjngwogo.supabase.co";
const KEY = "sb_publishable_2RMTYBUzF8zwOyB_E-VuzQ_c_oJnrMw";
const out = document.getElementById("out"), btn = document.getElementById("go");

function add(cls, title, detail){
  const d = document.createElement("div"); d.className = "r " + cls;
  const b = document.createElement("b"); b.textContent = title;
  const s = document.createElement("span"); s.textContent = detail || "";
  d.appendChild(b); d.appendChild(s); out.appendChild(d);
}
function withTimeout(url, opt, ms){
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms || 15000);
  return fetch(url, Object.assign({}, opt, { signal: c.signal })).finally(() => clearTimeout(t));
}
const errText = e => (e && e.name ? e.name : "Error") + ": " + (e && e.message ? e.message : e) +
  (e && e.name === "AbortError" ? " (tidak ada jawaban dalam 15 detik)" : "");
async function body(r){ try{ return (await r.text()).slice(0, 160); }catch(_){ return ""; } }

async function step(title, fn, soft){
  try{
    const res = await fn();
    if(soft && !res.ok) add("info", "INFO - " + title, res.text);
    else add(res.ok ? "ok" : "bad", (res.ok ? "BERHASIL - " : "GAGAL - ") + title, res.text);
  }catch(e){
    add(soft ? "info" : "bad", (soft ? "INFO - " : "GAGAL - ") + title, errText(e));
  }
}

async function run(){
  out.innerHTML = ""; btn.disabled = true;
  add("info", "Perangkat", navigator.userAgent + "\nOnline: " + navigator.onLine + "\nAlamat: " + location.href + "\nWaktu: " + new Date().toString());

  await step("script.js yang ter-deploy adalah versi terbaru?", async () => {
    const r = await withTimeout("script.js?cek=" + Date.now(), { cache: "no-store" });
    const t = await r.text();
    const baru = t.indexOf("Mode uji") !== -1;
    return { ok: r.ok && baru, text: "HTTP " + r.status + (baru ? " - versi BARU (ada mode debug)" : " - versi LAMA, ganti script.js di GitHub") };
  });

  await step("config.js yang ter-deploy", async () => {
    const r = await withTimeout("config.js?cek=" + Date.now(), { cache: "no-store" });
    const t = await r.text();
    const m = t.match(/supabase:\s*\{\s*url:\s*"([^"]*)"/);
    const inv = t.match(/invitation:\s*"([^"]*)"/);
    return { ok: r.ok && !!m && !!m[1], text: "HTTP " + r.status + "\nalamat supabase: " + (m ? m[1] : "(tidak ditemukan)") + "\ninvitation: " + (inv ? inv[1] : "(tidak ditemukan)") };
  });

  await step("Baca ucapan dengan header apikey (cara yang dipakai undangan)", async () => {
    const r = await withTimeout(SB_URL + "/rest/v1/rsvp?select=name&limit=3", { headers: { apikey: KEY } });
    const t = await body(r);
    return { ok: r.ok, text: "HTTP " + r.status + "\n" + t };
  });

  await step("Baca ucapan dengan apikey di alamat (tanpa header khusus)", async () => {
    const r = await withTimeout(SB_URL + "/rest/v1/rsvp?select=name&limit=3&apikey=" + encodeURIComponent(KEY));
    const t = await body(r);
    return { ok: r.ok, text: "HTTP " + r.status + "\n" + t };
  });

  await step("Kirim ucapan percobaan (invitation=diagnosa)", async () => {
    const r = await withTimeout(SB_URL + "/rest/v1/rsvp", {
      method: "POST",
      headers: { apikey: KEY, "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify({ invitation: "diagnosa", name: "Tes Diagnosa", attendance: "hadir", guests: 1, message: "tes koneksi " + new Date().toISOString() })
    });
    const t = await body(r);
    return { ok: r.ok, text: "HTTP " + r.status + (t ? "\n" + t : "") };
  });

  await step("Jalur proxy /sb (hanya perlu kalau config memakai /sb)", async () => {
    const r = await withTimeout("/sb/rest/v1/rsvp?select=name&limit=1", { headers: { apikey: KEY } });
    const t = await body(r);
    return { ok: r.ok, text: "HTTP " + r.status + (r.ok ? "" : " - proxy belum terpasang (abaikan jika config memakai alamat supabase langsung)") + "\n" + t.slice(0, 80) };
  }, true);

  add("info", "SELESAI", "Screenshot seluruh halaman ini dan kirim ke Claude.");
  btn.disabled = false;
}
btn.onclick = run;
run();
</script>
</body>
</html>
